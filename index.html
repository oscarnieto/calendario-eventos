/* =========================================================================
   CALENDARIO DE EVENTOS - archivo unico autocontenido
   Tres modos de visualizacion: mopi / escritorio / movil
   Todo el CSS cuelga de :root[data-modo="..."] para que el override por URL
   pueda ganar siempre a las media queries.
   ========================================================================= */

/* ---------- 1. TOKENS COMPARTIDOS ---------- */
:root{
  --fuente: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;

  --c-fondo:        #ffffff;
  --c-fondo-alt:    #f5f6f8;
  --c-fondo-hueco:  #eceef2;
  --c-linea:        #e3e6ec;
  --c-linea-fuerte: #c9cfd9;
  --c-tinta:        #14171f;
  --c-tinta-media:  #5a616e;
  --c-tinta-suave:  #8b929e;
  --c-acento:       #2f6fed;
  --c-acento-suave: #e8effd;
  --c-alerta:       #c0392b;
  --c-alerta-suave: #fbeceb;
  --c-aviso:        #8a5a00;
  --c-aviso-suave:  #fdf3e0;
  --c-cat-defecto:  #9aa1ae;
  --c-qr-fondo:     #ffffff;

  --r-s: 4px;
  --r-m: 8px;
  --r-l: 14px;
  --r-xl: 24px;
  --r-pastilla: 999px;

  --sombra-m: 0 2px 8px rgba(20,23,31,.08);
  --sombra-l: 0 18px 48px rgba(20,23,31,.18);
}

/* ---------- 2. RESET MINIMO ---------- */
*{ box-sizing: border-box; }
html, body{ margin:0; padding:0; }
body{
  font-family: var(--fuente);
  color: var(--c-tinta);
  background: var(--c-fondo-alt);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button{ font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
h1,h2,h3,h4,p,ul,ol{ margin:0; padding:0; }
ul,ol{ list-style:none; }
img{ max-width:100%; display:block; }
a{ color: inherit; }
.oculto{ display:none !important; }
.solo-lectores{
  position:absolute; width:1px; height:1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap;
}

/* ---------- 3. VISTA UNICA ----------
   Los tres modos comparten marcado: lo que cambia es el CSS que cuelga de
   :root[data-modo="..."], para que el override por URL siga mandando. */
.vista{ display:block; }

/* =========================================================================
   4. CALENDARIO - lenguaje visual comun a los tres modos
   Sale del Figma "Calendario": frames 1:2 (cartel) y 12:248 (popup).
   El color y la tipografia son unicos; solo cambian los tamanos y como se
   coloca cada pieza, que cada modo define mas abajo.
   ========================================================================= */
:root{
  --cal-fuente: "Montserrat", "Helvetica Neue", Helvetica, Arial, sans-serif;

  --cal-c-fondo:      #25273a;
  --cal-c-card-sin:   #2d2e45;
  --cal-c-card-con:   #ffdf00;
  --cal-c-num-sin:    #ffdf00;
  --cal-c-num-con:    #c90c0f;
  --cal-c-tinta-card: #25273a;
  --cal-c-linea:      rgba(120,121,152,.40);
  --cal-c-linea-ev:   rgba(37,39,58,.35);
  --cal-c-cabecera:   rgba(120,121,152,.53);
  --cal-c-acento:     #ffdf00;
  --cal-c-alerta:     #c90c0f;
  --cal-c-suave:      #787998;
  --cal-c-blanco:     #ffffff;

  --cal-pop-anim: 280ms;
  --cal-pop-mask-desenfoque: 18px;
  --cal-pop-mask-velo: rgba(37,39,58,.82);
  --cal-pop-mask-velo-solido: rgba(37,39,58,.94);
  --cal-pop-radio: 19px;
  --cal-card-radio: 1px;
  --cal-card-max-eventos: 3;
}

body{
  font-family: var(--cal-fuente);
  background: var(--cal-c-fondo);
  color: var(--cal-c-blanco);
}
.vista-cal{ display:block; }

/* ---------- cabecera: foto, degradado, logo, titular ---------- */
.cal-hero{
  background-color: var(--cal-c-card-sin);
  background-image: linear-gradient(135deg, #3a3c5c 0%, #25273a 100%);
  background-position: center top;
  background-size: cover;
  background-repeat: no-repeat;
  overflow:hidden;
}
.cal-hero img{
  width:100%; height:100%;
  object-fit: cover; object-position: center 45%;
  display:block;
}
.cal-degradado{
  background: -webkit-linear-gradient(top, rgba(37,39,58,0) 0%, #25273a 80%);
  background: linear-gradient(to bottom, rgba(37,39,58,0) 0%, #25273a 80%);
  pointer-events:none;
}
.cal-logo{
  background: var(--cal-c-acento);
  display:flex; align-items:center; justify-content:center;
  overflow:hidden; z-index:3;
}
.cal-logo span{
  font-size: .25em; font-weight:700; letter-spacing:-.03em;
  color: var(--cal-c-alerta);
}
.cal-logo img{
  position:absolute; left:0; top:0; width:100%; height:100%;
  object-fit: contain; display:block;
}
.cal-h1{
  font-size: var(--cal-fs-h1); line-height: var(--cal-lh-h1);
  font-weight:300; color: var(--cal-c-blanco);
  white-space:nowrap; z-index:2;
}
.cal-h1 b{ font-weight:700; color: var(--cal-c-acento); }

/* ---------- navegacion de mes ---------- */
.cal-nav{
  display:flex; align-items:center; z-index:4;
  background: var(--cal-c-fondo);
  border: 1px solid var(--cal-c-suave);
  border-radius: 2px;
  overflow:hidden;
}
.cal-btn{
  width: var(--cal-tactil); height: var(--cal-tactil);
  min-width: var(--cal-tactil);
  background: transparent;
  border: 0; border-left: 1px solid var(--cal-c-suave);
  color: var(--cal-c-acento);
  font-family: var(--cal-fuente);
  font-size: calc(var(--cal-tactil) * .28); font-weight:700; line-height:1;
  display:flex; align-items:center; justify-content:center;
}
.cal-nav .cal-btn:first-child{ border-left:0; }
.cal-btn:active{ background: var(--cal-c-acento); color: var(--cal-c-fondo); }
.cal-btn-hoy{ width:auto; min-width:0; padding: 0 calc(var(--cal-tactil) * .3); }
.cal-btn svg{
  width: 45%; height: 45%; display:block; fill:none;
  stroke: currentColor; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round;
}

/* ---------- cabecera de dias y rejilla ---------- */
.cal-semana{
  display:grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: var(--cal-card-hueco-x);
}
.cal-semana span{
  font-size: var(--cal-fs-cabecera); font-weight:700;
  color: var(--cal-c-cabecera);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.cal-rejilla{
  display:grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  column-gap: var(--cal-card-hueco-x);
  row-gap: var(--cal-card-hueco-y);
}
.cal-card{
  position:relative;
  background: var(--cal-c-card-sin);
  border: 1px solid var(--cal-c-linea);
  border-radius: var(--cal-card-radio);
  padding: var(--cal-card-pad-top) var(--cal-card-pad-x) var(--cal-card-pad-bot);
  display:flex; flex-direction:column; justify-content:space-between;
  text-align:right; overflow:hidden;
  font-family: var(--cal-fuente);
}
.cal-card[data-vacia="1"]{ background:transparent; border-color:transparent; }
.cal-card[data-eventos="1"]{ background: var(--cal-c-card-con); }
.cal-card[data-hoy="1"]{ box-shadow: inset 0 0 0 3px var(--cal-c-acento); }
.cal-card[data-eventos="1"][data-hoy="1"]{ box-shadow: inset 0 0 0 3px var(--cal-c-num-con); }
.cal-card-num{
  font-size: var(--cal-fs-dia); font-weight:700; line-height:1.12;
  color: var(--cal-c-num-sin);
}
.cal-card[data-eventos="1"] .cal-card-num{ color: var(--cal-c-num-con); }
.cal-card-lista{ display:block; min-height:0; overflow:hidden; }
.cal-card-ev{
  border-top: 1px solid var(--cal-c-linea-ev);
  padding-top: 5px; margin-top: 5px;
  font-size: var(--cal-fs-evento); font-weight:500;
  line-height: var(--cal-lh-evento);
  color: var(--cal-c-tinta-card);
  overflow-wrap: break-word; word-wrap: break-word;
  overflow:hidden;
  display:-webkit-box; -webkit-box-orient: vertical;
  -webkit-line-clamp:2; max-height: 2.4em; max-height: calc(2.4em + 6px);
}
/* cuantos menos eventos, mas lineas de titulo caben sin desbordar la card */
.cal-card-lista[data-n="1"] .cal-card-ev{ -webkit-line-clamp:5; max-height: calc(6.0em + 6px); }
.cal-card-lista[data-n="2"] .cal-card-ev{ -webkit-line-clamp:4; max-height: calc(4.8em + 6px); }
.cal-card-lista[data-n="3"] .cal-card-ev{ -webkit-line-clamp:2; max-height: calc(2.4em + 6px); }
/* el filete es un separador entre eventos: el primero de la card no lo lleva */
.cal-card-ev:first-child{ border-top:0; padding-top:0; margin-top:0; max-height: 2.4em; }
.cal-card-lista[data-n="1"] .cal-card-ev:first-child{ max-height: 6.0em; }
.cal-card-lista[data-n="2"] .cal-card-ev:first-child{ max-height: 4.8em; }
.cal-card-lista[data-n="3"] .cal-card-ev:first-child{ max-height: 2.4em; }
/* cuando la card no da de si, el JS baja el numero de lineas antes de
   ponerse a esconder eventos: mas vale un titulo corto que ningun titulo */
.cal-card-lista[data-fit="2"] .cal-card-ev,
.cal-card-lista[data-fit="2"] .cal-card-ev:first-child{
  -webkit-line-clamp:2; max-height: calc(2.4em + 6px);
}
.cal-card-lista[data-fit="1"] .cal-card-ev,
.cal-card-lista[data-fit="1"] .cal-card-ev:first-child{
  -webkit-line-clamp:1; max-height: calc(1.2em + 6px);
}
/* con line-clamp el recorte ya es exacto; el max-height solo hace de red */
@supports (-webkit-line-clamp: 2){
  .cal-card-ev,
  .cal-card-ev:first-child,
  .cal-card-lista[data-n="1"] .cal-card-ev,
  .cal-card-lista[data-n="2"] .cal-card-ev,
  .cal-card-lista[data-n="3"] .cal-card-ev,
  .cal-card-lista[data-n="1"] .cal-card-ev:first-child,
  .cal-card-lista[data-n="2"] .cal-card-ev:first-child,
  .cal-card-lista[data-n="3"] .cal-card-ev:first-child,
  .cal-card-lista[data-fit="2"] .cal-card-ev,
  .cal-card-lista[data-fit="2"] .cal-card-ev:first-child,
  .cal-card-lista[data-fit="1"] .cal-card-ev,
  .cal-card-lista[data-fit="1"] .cal-card-ev:first-child{ max-height: none; }
}
.cal-card-mas[data-ver="0"]{ display:none; }
.cal-card-ev[data-estado="cancelado"]{ text-decoration: line-through; opacity:.6; }
.cal-card-ev b{ font-weight:700; }
.cal-card-mas{
  display:block;
  border-top: 1px solid var(--cal-c-linea-ev);
  padding-top: 5px; margin-top: 5px;
  font-size: var(--cal-fs-evento); font-weight:700;
  line-height: var(--cal-lh-evento);
  color: var(--cal-c-num-con);
  white-space:nowrap;
}

/* ---------- pie ---------- */
.cal-pie-linea{ height:1px; background: var(--cal-c-suave); }
.cal-pie{
  font-size: var(--cal-fs-pie); line-height: var(--cal-lh-pie);
  font-weight:300; color: var(--cal-c-blanco);
}
.cal-pie b{ display:block; font-weight:700; color: var(--cal-c-acento); }

.cal-aviso{
  background: var(--cal-c-alerta); color: var(--cal-c-blanco);
  font-family: var(--cal-fuente);
  font-size: var(--cal-fs-aviso); font-weight:700; text-align:center;
}

/* ---------- popup del dia (Figma 12:248) ---------- */
.cal-modal-fondo{
  background: var(--cal-pop-mask-velo-solido);
  display:flex; align-items:center; justify-content:center;
  opacity: 0;
  -webkit-transition: opacity var(--cal-pop-anim) ease;
  transition: opacity var(--cal-pop-anim) ease;
}
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))){
  .cal-modal-fondo{
    background: var(--cal-pop-mask-velo);
    -webkit-backdrop-filter: blur(var(--cal-pop-mask-desenfoque));
    backdrop-filter: blur(var(--cal-pop-mask-desenfoque));
  }
}
.cal-modal-fondo[data-abierto="1"]{ opacity: 1; }
.cal-modal{
  position:relative;
  opacity: 0;
  -webkit-transform: translateY(26px) scale(.985);
  transform: translateY(26px) scale(.985);
  -webkit-transition: opacity var(--cal-pop-anim) ease,
                      -webkit-transform var(--cal-pop-anim) cubic-bezier(.2,.75,.3,1);
  transition: opacity var(--cal-pop-anim) ease,
              transform var(--cal-pop-anim) cubic-bezier(.2,.75,.3,1);
  width: var(--cal-pop-ancho);
  max-height: var(--cal-pop-alto-max);
  background: var(--cal-c-card-con);
  border-radius: var(--cal-pop-radio);
  padding: var(--cal-pop-pad-top) var(--cal-pop-pad-der) var(--cal-pop-pad-bot) var(--cal-pop-pad-izq);
  display:flex; flex-direction:column;
  font-family: var(--cal-fuente);
  color: var(--cal-c-tinta-card);
}
.cal-modal-fondo[data-abierto="1"] .cal-modal{
  opacity: 1;
  -webkit-transform: none;
  transform: none;
}
.cal-cerrar{
  position:absolute;
  top: var(--cal-pop-cerrar-top); right: var(--cal-pop-cerrar-der);
  width: var(--cal-pop-cerrar-lado); height: var(--cal-pop-cerrar-lado);
  background: transparent; color: var(--cal-c-num-con);
  display:flex; align-items:center; justify-content:center;
  border-radius: 2px;
}
.cal-cerrar svg{ width: var(--cal-pop-icono-cerrar); height: var(--cal-pop-icono-cerrar); display:block; }
.cal-cerrar:active{ background: var(--cal-c-num-con); color: var(--cal-c-card-con); }

.cal-pop-fecha{
  flex:0 0 auto;
  font-size: var(--cal-pop-fs-fecha);
  line-height: var(--cal-pop-lh-fecha);
  font-weight:300;
  margin-bottom: var(--cal-pop-hueco-cab);
  white-space:nowrap;
}
.cal-pop-fecha b{ font-weight:700; color: var(--cal-c-num-con); }

.cal-pop-eventos{
  /* flex-grow 0: la tarjeta crece con el contenido hasta su alto maximo,
     y solo entonces la lista se encoge y admite scroll interno */
  flex:0 1 auto; min-height:0;
  overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch;
}

.cal-ev{ display:flex; align-items:flex-end; gap: var(--cal-pop-hueco-qr); }
.cal-ev + .cal-ev{
  margin-top: var(--cal-pop-sep-arriba);
  padding-top: var(--cal-pop-sep-abajo);
  border-top: 1px solid var(--cal-c-linea-ev);
}
.cal-ev-txt{ flex:1 1 auto; min-width:0; }
.cal-ev-tit{
  font-size: var(--cal-pop-fs-titulo);
  line-height: var(--cal-pop-lh-titulo);
  font-weight:700;
  margin-bottom: var(--cal-pop-hueco-tit);
  overflow-wrap: break-word; word-wrap: break-word;
}
.cal-ev-tit-txt{ display:block; }
.cal-ev[data-estado="cancelado"] .cal-ev-tit-txt{ text-decoration: line-through; }
.cal-ev-tit .etiqueta{
  display:inline-block; margin: 10px 0 0;
  font-size: var(--cal-pop-fs-etiqueta);
  padding: 6px 18px;
}

.cal-ev-dato{
  display:flex; align-items:flex-start;
  gap: var(--cal-pop-icono-hueco);
  font-size: var(--cal-pop-fs-dato);
  line-height: var(--cal-pop-lh-dato);
  font-weight:400;
}
.cal-ev-dato i{
  flex:0 0 auto;
  width: var(--cal-pop-icono);
  height: calc(var(--cal-pop-fs-dato) * var(--cal-pop-lh-dato));
  display:flex; align-items:center; justify-content:center;
}
.cal-ev-dato svg{
  width: var(--cal-pop-icono); height: var(--cal-pop-icono);
  display:block; fill:none;
  stroke: currentColor; stroke-width:2;
  stroke-linecap:round; stroke-linejoin:round;
}
.cal-ev-dato span{ min-width:0; }
.cal-ev-desc{
  margin-top: var(--cal-pop-hueco-tit);
  font-size: var(--cal-pop-fs-dato);
  line-height: 1.35;
  max-height: calc(var(--cal-pop-fs-dato) * 1.35 * 4);
  overflow:hidden;
}
/* en movil, en vez de QR, un boton directo */
.cal-ev-boton{
  display:block; margin-top: 18px;
  padding: 14px 20px; border-radius: 2px;
  background: var(--cal-c-fondo); color: var(--cal-c-acento);
  font-size: var(--cal-pop-fs-dato); font-weight:700;
  text-align:center; text-decoration:none;
}
.cal-ev-boton:active{ background: var(--cal-c-num-con); color: var(--cal-c-blanco); }

.cal-ev-qr{ flex:0 0 auto; }
.cal-qr-caja{
  width: var(--cal-pop-qr); height: var(--cal-pop-qr);
  background:#ffffff;
  display:flex; align-items:center; justify-content:center;
}
.cal-qr-caja canvas{ width:100%; height:100%; display:block; }

/* con muchos eventos la lista se desliza: degradado mas indicador tactil */
.cal-pop-mas{
  position:absolute; left:0; right:0; z-index:2;
  bottom: calc(var(--cal-pop-pad-bot) - 22px);
  display:none; text-align:center; pointer-events:none;
}
.cal-modal[data-scroll="1"] .cal-pop-mas{ display:block; }
.cal-modal[data-fin="1"] .cal-pop-mas{ display:none; }
.cal-pop-mas i{
  display:inline-flex; align-items:center; justify-content:center;
  width:62px; height:62px; border-radius:50%;
  background: rgba(37,39,58,.10);
  color: var(--cal-c-num-con);
  -webkit-animation: calBota 1.9s ease-in-out infinite;
  animation: calBota 1.9s ease-in-out infinite;
}
.cal-pop-mas svg{
  width:30px; height:30px; display:block; fill:none;
  stroke: currentColor; stroke-width:2.4;
  stroke-linecap:round; stroke-linejoin:round;
}
@-webkit-keyframes calBota{
  0%,100%{ -webkit-transform: translateY(-4px); }
  50%    { -webkit-transform: translateY(5px); }
}
@keyframes calBota{
  0%,100%{ transform: translateY(-4px); }
  50%    { transform: translateY(5px); }
}
@media (prefers-reduced-motion: reduce){
  .cal-pop-mas i{ -webkit-animation: none; animation: none; }
  .cal-modal-fondo, .cal-modal{ -webkit-transition: none; transition: none; }
}
.cal-modal[data-scroll="1"]::after{
  content:''; position:absolute; pointer-events:none; z-index:1;
  left: var(--cal-pop-pad-izq); right: var(--cal-pop-pad-der);
  bottom: var(--cal-pop-pad-bot); height: 118px;
  background: -webkit-linear-gradient(top, rgba(255,223,0,0), #ffdf00 80%);
  background: linear-gradient(to bottom, rgba(255,223,0,0), #ffdf00 80%);
  -webkit-transition: opacity 220ms ease;
  transition: opacity 220ms ease;
}
.cal-modal[data-scroll="1"][data-fin="1"]::after{ opacity: 0; }

/* ---------- agenda (solo en movil) ---------- */
.cal-agenda{ display:none; }
.cal-agenda-fecha{
  font-size: var(--cal-fs-dia); font-weight:300;
  color: var(--cal-c-suave);
  margin: 26px 0 10px;
}
/* sobre el fondo oscuro el numero va en amarillo: el rojo de las cards no contrasta */
.cal-agenda-fecha b{ font-weight:700; color: var(--cal-c-acento); margin-right: 6px; }
.cal-agenda-item{
  display:block; width:100%; text-align:left;
  background: var(--cal-c-card-con);
  color: var(--cal-c-tinta-card);
  border-radius: 2px;
  padding: 16px 18px;
  margin-bottom: 10px;
  font-family: var(--cal-fuente);
}
.cal-agenda-item:active{ background: #f5d600; }
.cal-agenda-tit{
  display:block;
  font-size: var(--cal-pop-fs-titulo);
  line-height: var(--cal-pop-lh-titulo);
  font-weight:700;
  margin-bottom: 8px;
}
.cal-agenda-item[data-estado="cancelado"] .cal-ev-tit-txt{ text-decoration: line-through; }
.cal-agenda-vacia{
  font-size: var(--cal-pop-fs-dato); color: var(--cal-c-suave);
  text-align:center; padding: 32px 0;
}

/* ---------- etiquetas de estado ---------- */
.etiqueta{
  display:inline-block; border-radius: 2px;
  font-family: var(--cal-fuente);
  font-weight:700; letter-spacing:1px; text-transform:uppercase;
  white-space:nowrap;
  font-size: var(--cal-pop-fs-etiqueta); padding: 6px 16px;
}
.etiqueta[data-tipo="cancelado"]{ background: var(--cal-c-alerta); color:#fff; }
.etiqueta[data-tipo="completo"]{ background: var(--cal-c-fondo); color: var(--cal-c-acento); }
.etiqueta[data-tipo="categoria"]{ background: var(--cal-c-fondo); color: var(--cal-c-acento); }

/* =========================================================================
   5. MODO MOPI - lienzo fijo de 1080 x 1920 escalado a la pantalla
   ========================================================================= */
:root[data-modo="mopi"]{
  --cal-ancho: 1080px;
  --cal-alto: 1920px;
  --cal-margen: 47px;
  --cal-util: 985px;
  --cal-tactil: 96px;

  --cal-fs-h1: 71px;
  --cal-lh-h1: 87px;
  --cal-fs-cabecera: 20px;
  --cal-fs-dia: 30px;
  --cal-fs-evento: 14px;
  --cal-lh-evento: 1.2;
  --cal-fs-pie: 45px;
  --cal-lh-pie: 39.7px;
  --cal-fs-aviso: 26px;

  --cal-hero-alto: 541.273px;
  --cal-grad-top: 297.28px;
  --cal-grad-alto: 243.993px;
  --cal-logo-lado: 121.178px;
  --cal-h1-top: 422.394px;
  --cal-semana-top: 524.959px;
  --cal-rejilla-top: 559.347px;
  --cal-card-ancho: 181px;
  --cal-card-alto: 214.842px;
  --cal-card-hueco-x: 20px;
  --cal-card-hueco-y: 20.767px;
  --cal-card-pad-x: 8.86px;
  --cal-card-pad-top: 4.42px;
  --cal-card-pad-bot: 8.46px;
  --cal-pie-linea-top: 1759.25px;
  --cal-pie-top: 1775.09px;

  --cal-pop-mask-top: 509.394px;
  --cal-pop-mask-alto: 1230.549px;
  --cal-pop-ancho: 985px;
  --cal-pop-alto-max: 1180px;
  --cal-pop-pad-izq: 33.55px;
  --cal-pop-pad-der: 36.48px;
  --cal-pop-pad-top: 55.44px;
  --cal-pop-pad-bot: 74.2px;
  --cal-pop-hueco-cab: 83.72px;
  --cal-pop-fs-fecha: 71px;
  --cal-pop-lh-fecha: 87px;
  --cal-pop-fs-titulo: 45px;
  --cal-pop-lh-titulo: 1.05;
  --cal-pop-hueco-tit: 10px;
  --cal-pop-fs-dato: 32px;
  --cal-pop-lh-dato: 1.071;
  --cal-pop-fs-etiqueta: 22px;
  --cal-pop-icono: 24px;
  --cal-pop-icono-hueco: 6px;
  --cal-pop-icono-cerrar: 37.95px;
  --cal-pop-cerrar-lado: 88px;
  --cal-pop-cerrar-top: 7px;
  --cal-pop-cerrar-der: 2.5px;
  --cal-pop-qr: 146.573px;
  --cal-pop-hueco-qr: 32px;
  --cal-pop-sep-arriba: 49.66px;
  --cal-pop-sep-abajo: 35.09px;
}
:root[data-modo="mopi"], :root[data-modo="mopi"] body{
  width:100%; height:100%; overflow:hidden;
  overscroll-behavior: none;
  background:#000;
}
:root[data-modo="mopi"] body{
  touch-action: manipulation;
  -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color: transparent;
}
:root[data-modo="mopi"] ::-webkit-scrollbar{ width:0; height:0; display:none; }

:root[data-modo="mopi"] .cal-marco{
  position:fixed; top:0; left:0; right:0; bottom:0;
  overflow:hidden; background:#000;
}
:root[data-modo="mopi"] .cal-lienzo{
  position:absolute; top:0; left:0;
  width: var(--cal-ancho); height: var(--cal-alto);
  background: var(--cal-c-fondo);
  transform-origin: 0 0;
  overflow:hidden;
}
:root[data-modo="mopi"] .cal-hero{
  position:absolute; left:0; top:0;
  width: var(--cal-ancho); height: var(--cal-hero-alto);
}
:root[data-modo="mopi"] .cal-degradado{
  position:absolute; left:0; top: var(--cal-grad-top);
  width: var(--cal-ancho); height: var(--cal-grad-alto);
}
:root[data-modo="mopi"] .cal-logo{
  position:absolute; left: var(--cal-margen); top:0;
  width: var(--cal-logo-lado); height: var(--cal-logo-lado);
  font-size: var(--cal-logo-lado);
}
:root[data-modo="mopi"] .cal-h1{
  position:absolute; left: var(--cal-margen); top: var(--cal-h1-top);
}
:root[data-modo="mopi"] .cal-nav{ display:none; }
:root[data-modo="mopi"] .cal-semana{
  position:absolute; left: var(--cal-margen); top: var(--cal-semana-top);
  width: var(--cal-util);
}
:root[data-modo="mopi"] .cal-rejilla{
  position:absolute; left: var(--cal-margen); top: var(--cal-rejilla-top);
  width: var(--cal-util);
  grid-auto-rows: var(--cal-card-alto);
}
:root[data-modo="mopi"] .cal-pie-linea{
  position:absolute; left: var(--cal-margen); top: var(--cal-pie-linea-top);
  width: var(--cal-util);
}
:root[data-modo="mopi"] .cal-pie{
  position:absolute; left: var(--cal-margen); top: var(--cal-pie-top);
  white-space:nowrap;
}
/* la mascara del popup tapa solo la banda de la rejilla */
:root[data-modo="mopi"] .cal-modal-fondo{
  position:absolute; left:0; top: var(--cal-pop-mask-top);
  width: var(--cal-ancho); height: var(--cal-pop-mask-alto);
}
:root[data-modo="mopi"] .cal-aviso{
  position:absolute; left:0; right:0; bottom:0;
  padding: 16px var(--cal-margen);
}

/* =========================================================================
   6. ESCRITORIO Y MOVIL - mismo lenguaje, en flujo y fluido
   Todo se mide con clamp() sobre el ancho de ventana, con minimo y maximo
   fijados, y se declara siempre un valor de reserva antes por si el
   navegador no soporta clamp().
   ========================================================================= */
:root[data-modo="escritorio"],
:root[data-modo="movil"]{
  --cal-pop-radio: 14px;
  --cal-pop-lh-titulo: 1.15;
  --cal-pop-lh-dato: 1.35;
  --cal-pop-icono-hueco: 8px;
  --cal-pop-hueco-tit: 8px;
  --cal-pop-sep-arriba: 26px;
  --cal-pop-sep-abajo: 22px;
}
:root[data-modo="escritorio"] body,
:root[data-modo="movil"] body{
  min-height:100%;
  -webkit-text-size-adjust: 100%;
}
:root[data-modo="escritorio"] .cal-marco,
:root[data-modo="movil"] .cal-marco{ display:block; }
:root[data-modo="escritorio"] .cal-lienzo,
:root[data-modo="movil"] .cal-lienzo{
  position:relative;
  width:100%; max-width: var(--cal-max);
  margin:0 auto;
  padding-bottom: var(--cal-margen);
  transform:none;
}

/* En escritorio el calendario ocupa exactamente la ventana: ni un pixel de
   scroll. La rejilla se queda con el alto que sobra entre cabecera y pie,
   y los tamanos se miden contra el menor de ancho y alto para que una
   ventana baja y ancha no reviente las cards. */
:root[data-modo="escritorio"], :root[data-modo="escritorio"] body{
  height:100%; overflow:hidden;
}
:root[data-modo="escritorio"] .cal-marco{
  height: 100vh;
  height: 100dvh;
  overflow:hidden;
}
:root[data-modo="escritorio"] .cal-lienzo{
  height:100%; max-width:none;
  padding-bottom:0;
  display:flex; flex-direction:column;
  overflow:hidden;
}
:root[data-modo="escritorio"] .cal-hero,
:root[data-modo="escritorio"] .cal-h1,
:root[data-modo="escritorio"] .cal-semana,
:root[data-modo="escritorio"] .cal-pie-linea,
:root[data-modo="escritorio"] .cal-pie{ flex:0 0 auto; }
:root[data-modo="escritorio"] .cal-rejilla{
  flex:1 1 auto; min-height:0;
  grid-auto-rows: minmax(0, 1fr);
}

:root[data-modo="escritorio"] .cal-card{ min-height:0; height:auto; }
/* ventana demasiado baja para repartir cinco filas: se devuelve el scroll
   antes que dejar las cards ilegibles */
@media (max-height: 480px){
  :root[data-modo="escritorio"], :root[data-modo="escritorio"] body{
    height:auto; overflow:visible;
  }
  :root[data-modo="escritorio"] .cal-marco{ height:auto; overflow:visible; }
  :root[data-modo="escritorio"] .cal-lienzo{ height:auto; display:block; }
  :root[data-modo="escritorio"] .cal-card{ min-height: 72px; }
}
:root[data-modo="escritorio"] .cal-hero,
:root[data-modo="movil"] .cal-hero{
  position:relative;
  height: 260px;
  height: var(--cal-hero-alto);
}
:root[data-modo="escritorio"] .cal-degradado,
:root[data-modo="movil"] .cal-degradado{
  position:absolute; left:0; right:0; top:0;
  height: 260px;
  height: var(--cal-hero-alto);
  background: -webkit-linear-gradient(top, rgba(37,39,58,0) 45%, #25273a 100%);
  background: linear-gradient(to bottom, rgba(37,39,58,0) 45%, #25273a 100%);
}
:root[data-modo="escritorio"] .cal-logo,
:root[data-modo="movil"] .cal-logo{
  position:absolute; top:0; left: var(--cal-margen);
  width: var(--cal-logo-lado); height: var(--cal-logo-lado);
  font-size: var(--cal-logo-lado);
}
:root[data-modo="escritorio"] .cal-h1,
:root[data-modo="movil"] .cal-h1{
  position:relative;
  margin: -78px var(--cal-margen) 0;
  margin-top: calc(-1 * (var(--cal-lh-h1) + 0.42em));
  padding-right: calc(var(--cal-tactil) * 3.6);
  white-space:normal;
}
:root[data-modo="escritorio"] .cal-nav,
:root[data-modo="movil"] .cal-nav{
  position:absolute; right: var(--cal-margen);
  top: 16px;
}
:root[data-modo="escritorio"] .cal-semana,
:root[data-modo="movil"] .cal-semana{
  margin: var(--cal-hueco-cab) var(--cal-margen) 10px;
}
:root[data-modo="escritorio"] .cal-rejilla,
:root[data-modo="movil"] .cal-rejilla{
  margin: 0 var(--cal-margen);
}
:root[data-modo="movil"] .cal-rejilla{ grid-auto-rows: auto; }
:root[data-modo="escritorio"] .cal-card,
:root[data-modo="movil"] .cal-card{
  min-height: var(--cal-card-min);
}
/* en movil la card es un cuadrado con el numero; en escritorio la altura
   la reparte la rejilla para que el mes entre de una sola pantalla */
:root[data-modo="movil"] .cal-card{ aspect-ratio: var(--cal-card-ratio); }
:root[data-modo="escritorio"] .cal-card{ height:100%; }
/* el QR y el texto del evento se equilibran centrados fuera del MOPI */
:root[data-modo="escritorio"] .cal-ev{ align-items:center; }

:root[data-modo="escritorio"] .cal-pie-linea,
:root[data-modo="movil"] .cal-pie-linea{
  margin: 40px var(--cal-margen) 0;
}
:root[data-modo="escritorio"] .cal-pie,
:root[data-modo="movil"] .cal-pie{
  margin: 18px var(--cal-margen) 0;
}
:root[data-modo="escritorio"] .cal-pie-linea{
  margin-top: 24px;
  margin-top: clamp(12px, 2.6vh, 38px);
}
:root[data-modo="escritorio"] .cal-pie{
  margin-top: 14px;
  margin-top: clamp(8px, 1.7vh, 22px);
  padding-bottom: var(--cal-margen);
}
:root[data-modo="escritorio"] .cal-aviso,
:root[data-modo="movil"] .cal-aviso{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  padding: 12px 16px;
}
/* el popup cubre la ventana entera, no solo la banda de la rejilla */
:root[data-modo="escritorio"] .cal-modal-fondo,
:root[data-modo="movil"] .cal-modal-fondo{
  position:fixed; left:0; top:0; right:0; bottom:0; z-index:50;
  padding: var(--cal-margen) 12px;
}

/* ---------------------------- escritorio ---------------------------- */
:root[data-modo="escritorio"]{
  /* sin ancho maximo: el calendario ocupa el 100% de la ventana */
  --cal-max: none;
  --cal-margen: 32px;
  --cal-margen: clamp(14px, min(2.6vw, 3.4vh), 44px);
  --cal-tactil: 42px;
  --cal-tactil: clamp(34px, min(3.1vw, 5vh), 50px);
  --cal-hero-alto: 190px;
  --cal-hero-alto: clamp(90px, 18.5vh, 260px);
  --cal-logo-lado: 84px;
  --cal-logo-lado: clamp(44px, min(7vw, 11.5vh), 112px);
  --cal-hueco-cab: 16px;
  --cal-hueco-cab: clamp(8px, 1.9vh, 26px);

  --cal-fs-h1: 44px;
  --cal-fs-h1: clamp(22px, min(4.3vw, 6.2vh), 60px);
  --cal-lh-h1: 1.18em;
  --cal-fs-cabecera: 13px;
  --cal-fs-cabecera: clamp(10px, min(1.15vw, 1.7vh), 17px);
  --cal-fs-dia: 22px;
  --cal-fs-dia: clamp(13px, min(1.9vw, 2.9vh), 30px);
  --cal-fs-evento: 12px;
  --cal-fs-evento: clamp(9px, min(1vw, 1.5vh), 15px);
  --cal-lh-evento: 1.2;
  --cal-fs-pie: 26px;

var CAL = (function () {

    eventos: [],

    if (si) { nodo.className = nodo.className.replace(/\s*\boculto\b/g, ''); }

  }
  function escuchar(nodo, evt, fn) { if (nodo) { nodo.addEventListener(evt, fn, false); } }

  /* Muestra u oculta con transicion: al cerrar espera a que acabe el fundido

    if (!nodo) return;

    if (tCierre[id]) { clearTimeout(tCierre[id]); tCierre[id] = null; }
    if (si) {
      mostrar(nodo, true);
      if (nodo.offsetHeight >= 0) { nodo.setAttribute('data-abierto', '1'); }
      return;
    }
    if (nodo.className.indexOf('oculto') !== -1) { return; }
    nodo.setAttribute('data-abierto', '0');
    tCierre[id] = setTimeout(function () {
      tCierre[id] = null;
      if (nodo.getAttribute('data-abierto') !== '1') { mostrar(nodo, false); }
    }, MS_ANIM);
  }

  /* ---------------- Utilidades de texto ---------------- */
  function clave(v) {
    var s = String(v == null ? '' : v).toLowerCase().replace(/\s+/g, ' ').replace(/^ | $/g, '');
    s = s.replace(/[áàäâã]/g, 'a')
         .replace(/[éèëê]/g, 'e')
         .replace(/[íìïî]/g, 'i')
         .replace(/[óòöôõ]/g, 'o')
         .replace(/[úùüû]/g, 'u')
         .replace(/ñ/g, 'n');
    return s;
  }
  function texto(v) { return String(v == null ? '' : v).replace(/^\s+|\s+$/g, ''); }
  function capitalizar(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  /* ---------------- Utilidades de fecha ---------------- */
  function pad2(n) { n = String(n); return n.length < 2 ? '0' + n : n; }
  function iso(a, m, d) { return a + '-' + pad2(m) + '-' + pad2(d); }
  function isoDe(f) { return iso(f.getFullYear(), f.getMonth() + 1, f.getDate()); }
  function deIso(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function hoyIso() { return isoDe(new Date()); }
  function claveMes(f) { return f.getFullYear() + '-' + pad2(f.getMonth() + 1); }
  function primerDiaMes(f) { return new Date(f.getFullYear(), f.getMonth(), 1); }

  function validarFecha(a, m, d) {
    if (!(a >= 1970 && a <= 2200) || m < 1 || m > 12 || d < 1 || d > 31) return '';
    var f = new Date(a, m - 1, d);
    if (f.getFullYear() !== a || f.getMonth() !== m - 1 || f.getDate() !== d) return '';
    return iso(a, m, d);
  }

  function aFechaIso(v) {
    if (v === null || v === undefined || v === '') return '';
    if (typeof v === 'number' && isFinite(v)) {
      if (v < 1) return '';
      var d = new Date(Math.round((v - 25569) * 86400000));
      if (isNaN(d.getTime())) return '';
      return validarFecha(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    if (Object.prototype.toString.call(v) === '[object Date]') {
      if (isNaN(v.getTime())) return '';
      return validarFecha(v.getFullYear(), v.getMonth() + 1, v.getDate());
    }
    var s = texto(v);
    var m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/);
    if (m) { var a = +m[3]; if (a < 100) { a += 2000; } return validarFecha(a, +m[2], +m[1]); }
    m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    if (m) return validarFecha(+m[1], +m[2], +m[3]);
    return '';
  }

  /* Una casilla de fecha puede traer varias jornadas escritas a mano:
       "08, 09 y 19 /09/2026"        -> 8, 9 y 19 de septiembre
       "22, 23 y 24/09/2026"         -> 22, 23 y 24 de septiembre
       "29, 30 ,1 y 2 /09 y 10/2026" -> 29 y 30 de septiembre, 1 y 2 de octubre
     Los dias se reparten entre los meses en orden: cada vez que el dia baja
     respecto al anterior se pasa al mes siguiente de la lista. */
  function aFechasIso(v) {
    var una = aFechaIso(v);
    if (una) return [una];
    if (typeof v !== 'string') return [];

    var partes = v.split('/');
    if (partes.length !== 3) return [];

    var dias = numerosDe(partes[0]);
    var meses = numerosDe(partes[1]);
    var anios = numerosDe(partes[2]);
    if (!dias.length || !meses.length || !anios.length) return [];

    var anio = anios[0];
    if (anio < 100) { anio += 2000; }

    var salida = [], idx = 0, previo = 0, i, mes, aa, iso;
    for (i = 0; i < dias.length; i++) {
      if (dias[i] < previo && idx < meses.length - 1) { idx++; }
      previo = dias[i];
      mes = meses[idx];
      aa = mes < meses[0] ? anio + 1 : anio;
      iso = validarFecha(aa, mes, dias[i]);
      if (iso) { salida.push(iso); }
    }
    return salida;
  }

  function numerosDe(s) {
    var m = String(s == null ? '' : s).match(/\d+/g), r = [], i;
    if (!m) return r;
    for (i = 0; i < m.length; i++) { r.push(parseInt(m[i], 10)); }
    return r;
  }

  function aHora(v) {
    if (v === null || v === undefined || v === '') return '';
    if (typeof v === 'number' && isFinite(v)) {
      var frac = v - Math.floor(v);
      var tot = Math.round(frac * 1440);
      if (tot >= 1440) { tot = 1439; }
      if (tot < 0) return '';
      return pad2(Math.floor(tot / 60)) + ':' + pad2(tot % 60);
    }
    if (Object.prototype.toString.call(v) === '[object Date]') {
      if (isNaN(v.getTime())) return '';
      return pad2(v.getHours()) + ':' + pad2(v.getMinutes());
    }
    var m = texto(v).match(/^(\d{1,2})\s*[:.hH]\s*(\d{1,2})?/);
    if (!m) return '';

    return m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
  }
  function urlConUtm(url, modo) {
    if (!url) return '';
    var utm = UTM[modo] || UTM.escritorio;
    var base = url, hash = '';
    var i = url.indexOf('#');
    if (i !== -1) { base = url.slice(0, i); hash = url.slice(i); }
    return base + (base.indexOf('?') === -1 ? '?' : '&') + utm + hash;
  }
  function pintarQr(caja, url) {
    if (!caja) return false;
    caja.innerHTML = '';
    if (typeof qrcode === 'undefined' || !url) return false;
    var qr;
    try {
      qr = qrcode(0, 'M');
      qr.addData(url);
      qr.make();
    } catch (e) {
      console.warn('[calendario] no se pudo generar el QR para: ' + url, e);
      return false;
    }
    var n = qr.getModuleCount(), quiet = 4, total = n + quiet * 2;
    var escala = 6, px = escala * total;
    var c = document.createElement('canvas');
    c.width = px; c.height = px;
    c.style.width = '100%'; c.style.height = '100%';
    c.style.imageRendering = 'pixelated';
    var ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, px, px);
    ctx.fillStyle = '#000000';
    for (var r = 0; r < n; r++) {
      for (var col = 0; col < n; col++) {
        if (qr.isDark(r, col)) { ctx.fillRect((col + quiet) * escala, (r + quiet) * escala, escala, escala); }
      }
    }
    caja.appendChild(c);
    return true;
  }

  /* ---------------- Lectura del Excel ---------------- */
  function buscarHoja(wb, nombre, porDefectoPrimera) {
    for (var i = 0; i < wb.SheetNames.length; i++) {
      if (clave(wb.SheetNames[i]) === nombre) return wb.Sheets[wb.SheetNames[i]];
    }
    /* Si la hoja no se llama como esperamos, se usa la primera del libro. */
    if (porDefectoPrimera && wb.SheetNames.length) { return wb.Sheets[wb.SheetNames[0]]; }
    return null;
  }

  /* Quita acentos, signos y espacios sobrantes de una cabecera:
     "¿Quién participa?" -> "quien_participa", "Horario " -> "horario" */
  function claveCabecera(v) {
    var k = clave(v).replace(/[¿?¡!().,:;"'\u00ab\u00bb]/g, '');
    k = k.replace(/\s+/g, ' ').replace(/^ | $/g, '');
    return k.replace(/[ \-\/]/g, '_');
  }

  /* Las plantillas del equipo a veces empiezan con filas en blanco o un
     titulo: se busca la primera fila que sirva de cabecera. */
  function localizarCabecera(filas, obligatorias) {
    var max = Math.min(filas.length, 12), i, mapa, j, vale;
    for (i = 0; i < max; i++) {
      if (!filas[i] || !filas[i].length) continue;
      mapa = mapaColumnas(filas[i]);
      vale = true;
      for (j = 0; j < obligatorias.length; j++) {
        if (mapa[obligatorias[j]] === undefined) { vale = false; break; }
      }
      if (vale) return { fila: i, mapa: mapa };
    }
    return null;
  }

  function mapaColumnas(cabeceras) {
    var crudo = {}, mapa = {}, i, k, campo, j, a;
    for (i = 0; i < cabeceras.length; i++) {
      k = claveCabecera(cabeceras[i]);
      if (k && crudo[k] === undefined) { crudo[k] = i; }
    }
    for (campo in ALIAS) {
      if (!ALIAS.hasOwnProperty(campo)) continue;
      a = ALIAS[campo];
      for (j = 0; j < a.length; j++) {
        if (crudo[a[j]] !== undefined) { mapa[campo] = crudo[a[j]]; break; }
      }
    }
    /* cualquier cabecera literal sigue valiendo aunque no este en los alias */
    for (k in crudo) { if (crudo.hasOwnProperty(k) && mapa[k] === undefined) { mapa[k] = crudo[k]; } }
    return mapa;
  }

  function leerCategorias(wb) {
    var cats = {};
    var hoja = buscarHoja(wb, 'categorias', false);
    if (!hoja) {
      console.warn('[calendario] el Excel no trae hoja "Categorias": las categorias van sin color propio.');
      est.sinHojaCategorias = true;
      return cats;
    }
    est.sinHojaCategorias = false;
    var filas = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: '' });
    if (!filas.length) return cats;
    var mapa = mapaColumnas(filas[0]);
    var iCat = mapa.categoria !== undefined ? mapa.categoria : 0;
    var iCol = mapa.color !== undefined ? mapa.color : 1;
    for (var i = 1; i < filas.length; i++) {
      var nombre = texto(filas[i][iCat]);
      var color = aColor(filas[i][iCol]);
      if (!nombre) continue;
      if (!color) {
        console.warn('[calendario] categoria "' + nombre + '" con color no valido; se usa el neutro.');
        continue;
      }
      cats[clave(nombre)] = color;
    }
    return cats;
  }

  function leerEventos(wb) {
    var lista = [];
    var hoja = buscarHoja(wb, 'eventos', true);
    if (!hoja) {
      console.warn('[calendario] el Excel no tiene ninguna hoja legible.');
      return lista;
    }
    var filas = XLSX.utils.sheet_to_json(hoja, { header: 1, raw: true, defval: '' });
    if (filas.length < 2) return lista;

    var cab = localizarCabecera(filas, COLUMNAS_MINIMAS);
    if (!cab) {
      console.warn('[calendario] no se encuentra una cabecera con ' + COLUMNAS_MINIMAS.join(' y ') +
        '. Primera fila: ' + (filas[0] || []).join(' | '));
      return lista;
    }
    var mapa = cab.mapa, c;
    if (cab.fila > 0) {
      console.warn('[calendario] la cabecera esta en la fila ' + (cab.fila + 1) + '.');
    }
    var opcionales = [];
    for (c in ALIAS) {
      if (ALIAS.hasOwnProperty(c) && mapa[c] === undefined) { opcionales.push(c); }
    }
    if (opcionales.length) {
      console.warn('[calendario] columnas opcionales no encontradas, se omiten: ' + opcionales.join(', '));
    }
    function celda(fila, nombre) {
      var i = mapa[nombre];
      return i === undefined ? '' : fila[i];
    }

    var vistos = {}, catsAvisadas = {};
    for (var f = cab.fila + 1; f < filas.length; f++) {
      var fila = filas[f];
      if (!fila || !fila.length) continue;
      var numFila = f + 1;

      var fechas = aFechasIso(celda(fila, 'fecha'));
      var titulo = texto(celda(fila, 'titulo'));

      if (!fechas.length) {
        if (titulo || texto(celda(fila, 'id'))) {
          console.warn('[calendario] fila ' + numFila + ' ignorada: fecha no valida (' + celda(fila, 'fecha') + ')');
        }
        continue;
      }
      if (!titulo) {
        console.warn('[calendario] fila ' + numFila + ' ignorada: falta el titulo.');
        continue;
      }

      var id = texto(celda(fila, 'id'));
      if (!id) {
        id = 'fila-' + numFila;
        if (mapa.id !== undefined) {
          console.warn('[calendario] fila ' + numFila + ': sin id, se genera "' + id + '".');
        }
      }
      if (vistos[id]) {
        console.warn('[calendario] fila ' + numFila + ': id duplicado "' + id + '".');
        id = id + '-' + numFila;
      }
      vistos[id] = true;

      var categoria = texto(celda(fila, 'categoria'));
      if (!categoria) {
        console.warn('[calendario] fila ' + numFila + ': sin categoria; se usa el color neutro.');
      } else if (!est.sinHojaCategorias && !est.catsTmp[clave(categoria)] && !catsAvisadas[clave(categoria)]) {
        catsAvisadas[clave(categoria)] = true;
        console.warn('[calendario] categoria "' + categoria + '" sin color en la hoja Categorias; se usa el neutro.');
      }

      var estadoRaw = clave(celda(fila, 'estado'));
      var estado = 'activo';
      if (estadoRaw === 'cancelado' || estadoRaw === 'cancelada') { estado = 'cancelado'; }
      else if (estadoRaw === 'completo' || estadoRaw === 'completa' || estadoRaw === 'lleno' || estadoRaw === 'aforo completo') { estado = 'completo'; }
      else if (estadoRaw && estadoRaw !== 'activo' && estadoRaw !== 'activa') {
        console.warn('[calendario] fila ' + numFila + ': estado "' + estadoRaw + '" desconocido; se trata como activo.');
      }

      var destRaw = clave(celda(fila, 'destacado'));
      var destacado = (destRaw === 'si' || destRaw === 's' || destRaw === 'true' ||
                       destRaw === 'verdadero' || destRaw === 'x' || destRaw === '1' || destRaw === 'yes');

      var ponentes = [];
      var pon = texto(celda(fila, 'ponentes'));
      if (pon) {
        var trozos = pon.split(';');
        for (var p = 0; p < trozos.length; p++) {
          var t = texto(trozos[p]);
          if (t) { ponentes.push(t); }
        }
      }

      var url = texto(celda(fila, 'url_registro'));
      if (url && !/^https?:\/\//i.test(url)) {
        if (/^www\./i.test(url)) { url = 'https://' + url; }
        else {
          console.warn('[calendario] fila ' + numFila + ': url_registro no valida (' + url + '); se ignora.');
          url = '';
        }
      }

      var horas = aHoras(celda(fila, 'hora_inicio'), celda(fila, 'hora_fin'));

      /* una fila con varias jornadas se convierte en un evento por dia */
      for (var d = 0; d < fechas.length; d++) {
        lista.push({
          id: fechas.length > 1 ? id + '-' + (d + 1) : id,
          fecha: fechas[d],
          horaInicio: horas.inicio,
          horaFin: horas.fin,
          titulo: titulo,
          descripcion: texto(celda(fila, 'descripcion')),
          categoria: categoria,
          ubicacion: texto(celda(fila, 'ubicacion')),
          ponentes: ponentes,
          url: url,
          imagen: texto(celda(fila, 'imagen')),
          destacado: destacado,
          estado: estado
        });
      }
    }

    lista.sort(function (a, b) {
      if (a.fecha !== b.fecha) return a.fecha < b.fecha ? -1 : 1;
      var ha = a.horaInicio || '00:00', hb = b.horaInicio || '00:00';
      if (ha !== hb) return ha < hb ? -1 : 1;
      return a.titulo < b.titulo ? -1 : (a.titulo > b.titulo ? 1 : 0);
    });
    return lista;
  }

  function interpretar(wb) {
    est.catsTmp = leerCategorias(wb);
    var eventos = leerEventos(wb);
    var cats = est.catsTmp;
    est.catsTmp = null;
    return { categorias: cats, eventos: eventos };
  }

  /* ---------------- Carga y cache ---------------- */
  function guardarCache(datos) {
    try {
      window.localStorage.setItem(CLAVE_CACHE, JSON.stringify({
        ts: (new Date()).getTime(),
        categorias: datos.categorias,
        eventos: datos.eventos
      }));
    } catch (e) {
      console.warn('[calendario] no se pudo guardar la cache local.', e);
    }
  }
  function leerCache() {
    try {
      var crudo = window.localStorage.getItem(CLAVE_CACHE);
      if (!crudo) return null;
      var d = JSON.parse(crudo);
      if (!d || !d.eventos || !d.eventos.length) return null;
      return d;
    } catch (e) {
      console.warn('[calendario] cache local ilegible.', e);
      return null;
    }
  }

  function cargarDatos(esPrimera) {
    if (esPrimera) {
      var cacheIni = leerCache();
      if (cacheIni) {
        est.eventos = cacheIni.eventos;
        est.categorias = cacheIni.categorias || {};
        est.origen = 'cache';
        est.tsDatos = cacheIni.ts || 0;
        pintar();
      }
    }
    intentarRuta(0);
  }

  /* Prueba las rutas en orden. Solo pasa a la siguiente si el archivo no
     esta o no se puede leer; un archivo valido con cero filas se respeta. */
  function intentarRuta(indice) {
    if (indice >= RUTAS_XLSX.length) { sinDatos(); return; }

    var ruta = RUTAS_XLSX[indice];
    var xhr = new XMLHttpRequest();
    var binario = false;
    xhr.open('GET', ruta + '?v=' + (new Date()).getTime(), true);
    try { xhr.responseType = 'arraybuffer'; }
    catch (e) { binario = true; }
    if (!binario && xhr.responseType !== 'arraybuffer') { binario = true; }
    if (binario && xhr.overrideMimeType) { xhr.overrideMimeType('text/plain; charset=x-user-defined'); }
    xhr.timeout = 25000;

    function siguiente(motivo) {
      console.warn('[calendario] ' + ruta + ': ' + motivo);
      intentarRuta(indice + 1);
    }

    xhr.onload = function () {
      var ok = (xhr.status >= 200 && xhr.status < 300) || xhr.status === 0;
      if (!ok) { siguiente('HTTP ' + xhr.status); return; }
      var datos;
      try {
        var wb = binario
          ? XLSX.read(xhr.responseText, { type: 'binary' })
          : XLSX.read(new Uint8Array(xhr.response), { type: 'array' });
        datos = interpretar(wb);
      } catch (e) {
        console.warn('[calendario] ' + ruta + ' no se ha podido interpretar.', e);
        siguiente('excel ilegible');
        return;
      }
      if (!datos.eventos.length) {
        console.warn('[calendario] ' + ruta + ' no contiene ninguna fila valida.');
      }
      est.eventos = datos.eventos;
      est.categorias = datos.categorias;
      est.origen = 'excel';
      est.archivo = ruta;
      est.tsDatos = (new Date()).getTime();
      guardarCache(datos);
      if (est.diaSel && !eventosDe(est.diaSel).length) { est.diaSel = ''; est.eventoSel = null; }
      if (est.eventoSel) { est.eventoSel = porId(est.eventoSel.id); }
      pintar();
    };
    xhr.onerror = function () { siguiente('error de red'); };
    xhr.ontimeout = function () { siguiente('tiempo de espera agotado'); };
    try { xhr.send(); } catch (e) { siguiente('envio bloqueado'); }
  }

  /* Ninguna ruta ha respondido: se pinta desde la copia local si la hay. */
  function sinDatos() {
    console.warn('[calendario] no se pudo leer ningun archivo de datos (' + RUTAS_XLSX.join(', ') + ').');
    if (est.eventos.length && est.origen === 'excel') { return; }
    var cache = leerCache();
    if (cache) {
      est.eventos = cache.eventos;
      est.categorias = cache.categorias || {};
      est.origen = 'cache';
      est.tsDatos = cache.ts || 0;
    } else {
      est.origen = 'vacio';
    }
    pintar();
  }

  /* ---------------- Consultas sobre los datos ---------------- */
  function eventosDe(isoStr) {
    var r = [];
    for (var i = 0; i < est.eventos.length; i++) {
      if (est.eventos[i].fecha === isoStr) { r.push(est.eventos[i]); }
    }
    return r;
  }
  function eventosDelMes(f) {
    var pre = claveMes(f), r = [];
    for (var i = 0; i < est.eventos.length; i++) {
      if (est.eventos[i].fecha.slice(0, 7) === pre) { r.push(est.eventos[i]); }
    }
    return r;
  }
  function porId(id) {
    for (var i = 0; i < est.eventos.length; i++) {
      if (est.eventos[i].id === id) return est.eventos[i];
    }
    return null;
  }
  function matrizMes(f) {
    var anio = f.getFullYear(), mes = f.getMonth();
    var desplaz = (new Date(anio, mes, 1).getDay() + 6) % 7;
    var celdas = [];
    for (var i = 0; i < 42; i++) {
      var d = new Date(anio, mes, 1 - desplaz + i);
      var s = isoDe(d);
      celdas.push({ iso: s, dia: d.getDate(), delMes: d.getMonth() === mes, eventos: eventosDe(s) });
    }
    return celdas;
  }
  function etiquetasEstado(ev) {
    var h = '';
    if (ev.estado === 'cancelado') { h += '<span class="etiqueta" data-tipo="cancelado">Cancelado</span>'; }
    if (ev.estado === 'completo') { h += '<span class="etiqueta" data-tipo="completo">Aforo completo</span>'; }
    return h;
  }
  function avisoCache() {
    if (est.origen === 'cache') {
      return 'Sin conexión con el archivo de eventos. Mostrando los últimos datos guardados' +
             (est.tsDatos ? ' el ' + selloFecha(est.tsDatos) : '') + '.';
    }
    return '';
  }

  /* =======================================================================
     RENDER - MODO MOPI
     ======================================================================= */
  function escalarMopi() {
    var lienzo = el('calLienzo');
    if (!lienzo) return;
    var vw = window.innerWidth || MOPI_ANCHO;
    var vh = window.innerHeight || MOPI_ALTO;
    var k = Math.min(vw / MOPI_ANCHO, vh / MOPI_ALTO);
    lienzo.style.transform = 'scale(' + k + ')';
    lienzo.style.left = Math.round((vw - MOPI_ANCHO * k) / 2) + 'px';
    lienzo.style.top = Math.round((vh - MOPI_ALTO * k) / 2) + 'px';
  }

  function pintarMopi() {
    var f = est.mesVista, i, j, k;
    var dias = diasVisibles(), cols = dias.length;
    var conTitulos = (est.modo !== 'movil');

    el('calMes').textContent = capitalizar(MESES[f.getMonth()]);
    el('calAnio').textContent = f.getFullYear();
    el('calRejilla').style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';
    el('calSemana').style.gridTemplateColumns = 'repeat(' + cols + ', minmax(0, 1fr))';

    var h = '';
    for (i = 0; i < cols; i++) { h += '<span>' + dias[i] + '</span>'; }
    el('calSemana').innerHTML = h;

    var filas = matrizMopi(f), hoy = hoyIso();
    h = '';
    for (i = 0; i < filas.length; i++) {
      for (j = 0; j < cols; j++) {
        var c = filas[i][j];
        if (!c.dentro) { h += '<div class="cal-card" data-vacia="1"></div>'; continue; }
        var n = c.eventos.length;
        var vis = conTitulos ? (n > MOPI_MAX_EVENTOS ? MOPI_MAX_EVENTOS : n) : 0;
        var lista = '';
        for (k = 0; k < vis; k++) {
          var e = c.eventos[k];
          lista += '<span class="cal-card-ev" data-estado="' + e.estado + '">' +
                     '<span class="cal-card-t" data-titulo="' + esc(e.titulo) + '">' + esc(e.titulo) + '</span>' +
                     (e.estado === 'completo' ? ' <b>(completo)</b>' : '') +
                   '</span>';
        }
        if (conTitulos && n > 0) {
          lista += '<span class="cal-card-mas" data-ver="' +
                   (n > MOPI_MAX_EVENTOS ? '1' : '0') + '">Ver todos (' + n + ')</span>';
        }
        h += '<button type="button" class="cal-card" data-fecha="' + c.iso + '"' +
             ' data-eventos="' + (n ? '1' : '0') + '"' +
             ' data-n="' + n + '"' +
             ' data-hoy="' + (c.iso === hoy ? '1' : '0') + '">' +
             '<span class="cal-card-num">' + pad2(c.dia) + '</span>' +
             '<span class="cal-card-lista" data-n="' + (n > MOPI_MAX_EVENTOS ? MOPI_MAX_EVENTOS : n) + '">' + lista + '</span>' +
             '</button>';
      }
    }
    el('calRejilla').innerHTML = h;
    ajustarRejilla();

    pintarAgenda(f);
    avisarFinDeSemana(f);
    pintarPanelMopi();

    var aviso = avisoCache();
    el('calAviso').textContent = aviso;
    mostrar(el('calAviso'), !!aviso);
  }

  /* En movil las cards solo llevan el numero: el contenido va en la agenda. */
  function pintarAgenda(f) {
    var cont = el('calAgenda');
    if (est.modo !== 'movil') { cont.innerHTML = ''; return; }

    var mes = eventosDelMes(f), i, h = '', ultima = '';
    if (!mes.length) {
      cont.innerHTML = '<p class="cal-agenda-vacia">No hay eventos este mes.</p>';
      return;
    }
    for (i = 0; i < mes.length; i++) {
      var e = mes[i];
      if (e.fecha !== ultima) {
        ultima = e.fecha;
        var d = deIso(e.fecha);
        h += '<div class="cal-agenda-fecha"><b>' + pad2(d.getDate()) + '</b> ' +
             capitalizar(DIAS_LARGOS[d.getDay()]) + '</div>';
      }
      var datos = '';
      if (franjaH(e)) { datos += filaDato(ICONOS.reloj, franjaH(e)); }
      if (e.ubicacion) { datos += filaDato(ICONOS.lugar, e.ubicacion); }
      h += '<button type="button" class="cal-agenda-item" data-fecha="' + e.fecha + '" data-estado="' + e.estado + '">' +
             '<span class="cal-agenda-tit"><span class="cal-ev-tit-txt">' + esc(e.titulo) + '</span>' +
               etiquetasEstado(e) + '</span>' +
             datos +
           '</button>';
    }
    cont.innerHTML = h;
  }

  /* El recorte de CSS corta limpio pero no siempre pinta los puntos
     suspensivos, y un titulo cortado sin marca se lee como si fuera entero.
     Se mide el desbordamiento real y se recorta por busqueda binaria. */
  function recortarTitulos() {
    var evs = el('calRejilla').getElementsByClassName('cal-card-ev');
    var i, caja, t, texto, lo, hi, mid;
    for (i = 0; i < evs.length; i++) {
      caja = evs[i];
      t = caja.getElementsByClassName('cal-card-t')[0];
      if (!t) continue;
      texto = t.getAttribute('data-titulo') || '';
      t.textContent = texto;
      if (caja.scrollHeight <= caja.clientHeight + 1) continue;
      lo = 0; hi = texto.length;
      while (lo < hi) {
        mid = Math.ceil((lo + hi) / 2);
        t.textContent = limpiarCola(texto.slice(0, mid)) + '…';
        if (caja.scrollHeight <= caja.clientHeight + 1) { lo = mid; } else { hi = mid - 1; }
      }
      t.textContent = limpiarCola(texto.slice(0, lo)) + '…';
    }
  }
  function limpiarCola(s) { return s.replace(/[\s,.;:·\-]+$/, ''); }

  /* En escritorio la altura de la card la impone la ventana, no el contenido.
     Si la lista no cabe se ocultan los ultimos eventos y se remata con el
     "Ver todos (N)", que abre el popup del dia con todo. */
  /* Proporcion maxima ancho/alto de una card de escritorio. Por encima de
     esto la casilla se lee como una banda, asi que se estrecha la rejilla
     y se centra en vez de estirarla de lado a lado. */
  var CARD_PROPORCION_MAX = 1.45;

  function encuadrarRejilla() {
    var rej = el('calRejilla'), sem = el('calSemana'), i;
    var cajas = [rej, sem];
    /* se parte siempre del ancho natural: si no, se mide el encuadre anterior */
    for (i = 0; i < cajas.length; i++) {
      cajas[i].style.width = '';
      cajas[i].style.marginLeft = '';
      cajas[i].style.marginRight = '';
    }
    if (est.modo !== 'escritorio') { return; }

    var cols = diasVisibles().length;
    var celdas = rej.getElementsByClassName('cal-card').length;
    if (!cols || !celdas) { return; }
    var filas = Math.ceil(celdas / cols);

    var cs = window.getComputedStyle(rej);
    var gx = parseFloat(cs.columnGap) || 0;
    var gy = parseFloat(cs.rowGap) || 0;
    var margen = parseFloat(cs.marginLeft) || 0;
    var disponible = rej.clientWidth;
    var altoCard = (rej.clientHeight - gy * (filas - 1)) / filas;
    if (!(altoCard > 0) || !(disponible > 0)) { return; }

    var ancho = Math.floor(altoCard * CARD_PROPORCION_MAX * cols + gx * (cols - 1));
    if (ancho >= disponible) { return; }

    /* el hueco que sobra se reparte a los dos lados: la rejilla y la
       cabecera de dias quedan centradas y alineadas entre si */
    var lado = Math.round(margen + (disponible - ancho) / 2);
    for (i = 0; i < cajas.length; i++) {
      cajas[i].style.width = ancho + 'px';
      cajas[i].style.marginLeft = lado + 'px';
      cajas[i].style.marginRight = lado + 'px';
    }
  }

  var NIVELES_FIT = ['2', '1'];
  function ajustarCards() {
    var cards = el('calRejilla').getElementsByClassName('cal-card');
    var i, j, card, lista, evs, mas, visibles, guarda;
    for (i = 0; i < cards.length; i++) {
      card = cards[i];
      lista = card.getElementsByClassName('cal-card-lista')[0];
      if (!lista) { continue; }
      evs = lista.getElementsByClassName('cal-card-ev');
      mas = lista.getElementsByClassName('cal-card-mas')[0];
      if (!evs.length) { continue; }

      /* se parte siempre del estado pintado, no del ajuste anterior */
      for (j = 0; j < evs.length; j++) { evs[j].style.display = ''; }
      lista.removeAttribute('data-fit');
      var totales = parseInt(card.getAttribute('data-n'), 10) || evs.length;
      if (mas) { mas.setAttribute('data-ver', totales > evs.length ? '1' : '0'); }

      /* primero se aprieta el numero de lineas por titulo */
      for (j = 0; j < NIVELES_FIT.length; j++) {
        if (lista.scrollHeight <= lista.clientHeight + 1) { break; }
        lista.setAttribute('data-fit', NIVELES_FIT[j]);
      }

      visibles = evs.length;
      guarda = 0;
      while (visibles > 0 && lista.scrollHeight > lista.clientHeight + 1 && guarda < 12) {
        guarda++;
        visibles--;
        evs[visibles].style.display = 'none';
        if (mas) { mas.setAttribute('data-ver', '1'); }
      }
      /* ni el "Ver todos" cabe: la card se queda solo con el numero */
      if (mas && visibles === 0 && lista.scrollHeight > lista.clientHeight + 1) {
        mas.setAttribute('data-ver', '0');
      }
    }
  }

  function ajustarRejilla() {
    /* encuadrar va siempre: tambien para deshacer el encuadre de escritorio
       al pasar a movil o al MOPI */
    encuadrarRejilla();
    if (est.modo === 'movil') { return; }
    recortarTitulos();
    ajustarCards();
  }

  /* La rejilla del Figma es de lunes a viernes. Un mes nunca ocupa mas de
     cinco filas laborables, asi que el lienzo de 1920 px siempre cuadra. */
  function matrizMopi(f) {
    var anio = f.getFullYear(), mes = f.getMonth();
    var cols = diasVisibles().length;
    var desplaz = (new Date(anio, mes, 1).getDay() + 6) % 7;
    var filas = [], i, j;
    for (i = 0; i < 6; i++) {
      var semana = [], hay = false;
      for (j = 0; j < cols; j++) {
        var d = new Date(anio, mes, 1 - desplaz + i * 7 + j);
        var dentro = (d.getMonth() === mes && d.getFullYear() === anio);
        if (dentro) { hay = true; }
        var s = isoDe(d);
        semana.push({ iso: s, dia: d.getDate(), dentro: dentro, eventos: dentro ? eventosDe(s) : [] });
      }
      if (hay) { filas.push(semana); }
    }
    return filas;
  }

  function avisarFinDeSemana(f) {
    if (diasVisibles().length > 5) return;
    var mes = eventosDelMes(f), fuera = [], i, d;
    for (i = 0; i < mes.length; i++) {
      d = deIso(mes[i].fecha).getDay();
      if (d === 0 || d === 6) { fuera.push(mes[i].fecha + ' · ' + mes[i].titulo); }
    }
    if (fuera.length) {
      console.warn('[calendario] la rejilla del MOPI es de lunes a viernes: ' + fuera.length +
        ' evento(s) en fin de semana no salen en la rejilla -> ' +
        fuera.join(' | '));
    }
  }

  /* El calendario nunca deja la pantalla: lo unico que se superpone es el
     popup del dia, y solo mientras haya un dia seleccionado. */
  function pintarPanelMopi() {
    if (est.diaSel) { pintarModalMopi(); }
    else { mostrarAnimado(el('calModal'), false); }
  }

  /* Horario tal y como lo escribe el diseno: "19:00h" / "19:00h - 21:00h" */
  function franjaH(ev) {
    if (!ev.horaInicio) return '';
    return ev.horaFin ? ev.horaInicio + 'h - ' + ev.horaFin + 'h' : ev.horaInicio + 'h';
  }

  function filaDato(icono, txt) {
    return '<div class="cal-ev-dato"><i>' + icono + '</i><span>' + esc(txt) + '</span></div>';
  }

  function eventoPopupMopi(ev) {
    var datos = '';
    if (franjaH(ev)) { datos += filaDato(ICONOS.reloj, franjaH(ev)); }
    if (ev.ubicacion) { datos += filaDato(ICONOS.lugar, ev.ubicacion); }
    if (ev.ponentes.length) { datos += filaDato(ICONOS.persona, 'Participa: ' + ev.ponentes.join(', ')); }
    /* El Figma no muestra el tipo de evento en el popup. Para sacarlo, basta
       con anadir aqui: filaDato(ICONOS.tipo, ev.categoria) */

    /* Escanear un QR desde el propio movil no tiene sentido: ahi va un boton. */
    var qr = '', boton = '';
    if (ev.url && ev.estado !== 'cancelado') {
      if (est.modo === 'movil') {
        boton = '<a class="cal-ev-boton" href="' + esc(urlConUtm(ev.url, 'movil')) +
                '" target="_blank" rel="noopener">Apúntate aquí</a>';
      } else {
        qr = '<div class="cal-ev-qr"><div class="cal-qr-caja" data-qr="' +
             esc(urlConUtm(ev.url, est.modo)) + '"></div></div>';
      }
    }

    return '<article class="cal-ev" data-estado="' + ev.estado + '">' +
             '<div class="cal-ev-txt">' +
               '<h3 class="cal-ev-tit"><span class="cal-ev-tit-txt">' + esc(ev.titulo) + '</span>' +
                 etiquetasEstado(ev) +
               '</h3>' +
               datos +
               (ev.descripcion ? '<p class="cal-ev-desc">' + esc(ev.descripcion) + '</p>' : '') +
               boton +
             '</div>' + qr +
           '</article>';
  }

  function pintarModalMopi() {
    var modal = el('calModal'), cuerpo = el('calModalCuerpo');
    var lista = eventosDe(est.diaSel), i, h = '';

    if (!lista.length) { est.diaSel = ''; mostrarAnimado(modal, false); return; }

    var f = deIso(est.diaSel);
    el('calModalFecha').innerHTML = '<b>' + pad2(f.getDate()) + '</b> ' + capitalizar(MESES[f.getMonth()]);

    for (i = 0; i < lista.length; i++) { h += eventoPopupMopi(lista[i]); }
    cuerpo.innerHTML = h;
    cuerpo.scrollTop = 0;

    var cajas = cuerpo.getElementsByClassName('cal-qr-caja');
    for (i = 0; i < cajas.length; i++) { pintarQr(cajas[i], cajas[i].getAttribute('data-qr')); }

    mostrarAnimado(modal, true);
    var tarjeta = modal.getElementsByClassName('cal-modal')[0];
    if (tarjeta) {
      tarjeta.setAttribute('data-scroll', cuerpo.scrollHeight > cuerpo.clientHeight + 2 ? '1' : '0');
      tarjeta.setAttribute('data-fin', '0');
    }
  }

  function cerrarPopupMopi() {
    est.diaSel = '';
    est.eventoSel = null;
    pintarMopi();
  }

  /* =======================================================================
     PINTADO GENERAL Y CAMBIO DE MODO
     ======================================================================= */
  function pintar() {
    if (!est.mesVista) { est.mesVista = primerDiaMes(new Date()); }
    pintarMopi();
    if (est.modo === 'mopi') { escalarMopi(); }
  }

  function detectarModo() {
    var forzado = clave(paramUrl('modo'));
    if (forzado === 'mopi' || forzado === 'escritorio' || forzado === 'movil') return forzado;

    var an = window.innerWidth || document.documentElement.clientWidth || 1080;
    var al = window.innerHeight || document.documentElement.clientHeight || 1920;
    /* el MOPI es un totem 9:16: vertical, grande y de proporcion muy estrecha.
       Una tablet en vertical (3:4) NO es un MOPI, se lleva el diseno de escritorio. */
    if (al > an && an >= 1000 && (an / al) <= 0.66) { return 'mopi'; }
    if (an < 760) { return 'movil'; }
    return 'escritorio';
  }

  function aplicarModo(nuevo, forzarPintado) {
    if (nuevo === est.modo && !forzarPintado) { if (nuevo === 'mopi') { escalarMopi(); } return; }
    est.modo = nuevo;
    document.documentElement.setAttribute('data-modo', nuevo);

    /* al cambiar de modo se cierra el popup y se limpia la seleccion */
    mostrar(el('calModal'), false);
    el('calModal').setAttribute('data-abierto', '0');
    est.diaSel = '';
    est.eventoSel = null;
    if (est.modo !== 'mopi') { el('calLienzo').style.transform = ''; el('calLienzo').style.left = ''; el('calLienzo').style.top = ''; }

    pararTemporizadoresMopi();
    if (nuevo === 'mopi') { reiniciarInactividad(); }
    pintar();
  }

  function revisarModo() {
    var nuevo = detectarModo();
    if (nuevo !== est.modo) { aplicarModo(nuevo); }
    else if (nuevo === 'mopi') { escalarMopi(); }
    /* en escritorio las cards son fluidas: al cambiar de ancho hay que
       volver a medir donde cortar los titulos */
    else if (nuevo === 'escritorio') { ajustarRejilla(); }
  }

  /* =======================================================================
     NAVEGACION DE MESES
     ======================================================================= */
  function irAMes(delta) {
    var f = est.mesVista;
    est.mesVista = new Date(f.getFullYear(), f.getMonth() + delta, 1);
    est.diaSel = '';
    est.eventoSel = null;
    pintar();
  }
  function irAHoy() {
    est.mesVista = primerDiaMes(new Date());
    est.diaSel = '';
    est.eventoSel = null;
    pintar();
  }

  /* =======================================================================
     TEMPORIZADORES DEL MOPI
     ======================================================================= */
  function pararTemporizadoresMopi() {
    if (tIdle) { clearTimeout(tIdle); tIdle = null; }
  }

  /* Lo unico que hace la inactividad es cerrar el popup y devolver la vista
     del mes: el calendario esta siempre en pantalla. */
  function reiniciarInactividad() {
    if (est.modo !== 'mopi') return;
    if (tIdle) { clearTimeout(tIdle); }
    tIdle = setTimeout(function () {
      if (est.diaSel) { cerrarPopupMopi(); }
    }, MS_INACTIVIDAD);
  }

  function toqueMopi() {
    if (est.modo !== 'mopi') return;
    reiniciarInactividad();
  }

  /* =======================================================================
     EVENTOS DE INTERFAZ
     ======================================================================= */
  function tieneClase(n, c) {
    if (!n || !n.className || n.nodeType !== 1) return false;
    return (' ' + String(n.className) + ' ').indexOf(' ' + c + ' ') !== -1;
  }
  function celdaPulsada(e, clase) {
    var n = e.target;
    while (n && n !== document.body) {
      if (tieneClase(n, clase)) return n;
      n = n.parentNode;
    }
    return null;
  }

  function conectarEventos() {
    /* --- rejilla: un dia con eventos abre el popup --- */
    escuchar(el('calRejilla'), 'click', function (e) {
      var celda = celdaPulsada(e, 'cal-card');
      if (!celda || celda.getAttribute('data-eventos') !== '1') return;
      est.diaSel = celda.getAttribute('data-fecha');
      est.eventoSel = null;
      pintarPanelMopi();

    /* --- agenda de movil: cada evento abre el popup de su dia --- */

      var item = celdaPulsada(e, 'cal-agenda-item');
      if (!item) return;
      est.diaSel = item.getAttribute('data-fecha');
      est.eventoSel = null;
      pintarPanelMopi();
    });

    /* --- popup --- */
    escuchar(el('calCerrar'), 'click', function () { cerrarPopupMopi(); });

    escuchar(el('calModalCuerpo'), 'scroll', function () {
      var c = el('calModalCuerpo');
      var tarjeta = c.parentNode;
      if (!tarjeta) return;
      var fin = (c.scrollTop + c.clientHeight >= c.scrollHeight - 8);
      tarjeta.setAttribute('data-fin', fin ? '1' : '0');
    });

    /* tocar fuera de la tarjeta cierra el popup */
    escuchar(el('calModal'), 'click', function (e) {
      if (e.target === el('calModal')) { cerrarPopupMopi(); }
    });

    /* --- navegacion de mes (oculta en el MOPI) --- */
    escuchar(el('calAnterior'), 'click', function () { irAMes(-1); });
    escuchar(el('calSiguiente'), 'click', function () { irAMes(1); });
    escuchar(el('calHoy'), 'click', function () { irAHoy(); });

    /* --- teclado: flechas cambian de mes, Escape cierra --- */
    escuchar(document, 'keydown', function (e) {
      var k = e.keyCode || e.which;
      if (k === 27) { cerrarPopupMopi(); return; }
      if (est.modo === 'mopi') return;
      if (el('calModal').className.indexOf('oculto') === -1) return;
      if (k === 37) { irAMes(-1); }
      else if (k === 39) { irAMes(1); }
    });

    /* --- swipe horizontal sobre la rejilla para cambiar de mes --- */

      var x0 = 0, y0 = 0, activo = false;
      var zona = el('calRejilla');
      escuchar(zona, 'touchstart', function (e) {
        if (est.modo === 'mopi') { activo = false; return; }
        if (!e.touches || e.touches.length !== 1) { activo = false; return; }
        x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; activo = true;
      });
      escuchar(zona, 'touchend', function (e) {

        activo = false;
        var dx = e.changedTouches[0].clientX - x0;
        var dy = e.changedTouches[0].clientY - y0;

    if (window.matchMedia) {

      if (est.modo === 'mopi') { e.preventDefault(); }
    });
    escuchar(document, 'gesturestart', function (e) {
      if (est.modo === 'mopi') { e.preventDefault(); }
    });
    escuchar(document, 'touchmove', function (e) {
      if (est.modo === 'mopi' && e.touches && e.touches.length > 1) { e.preventDefault(); }
    });
    escuchar(document, 'selectstart', function (e) {
      if (est.modo === 'mopi') { e.preventDefault(); }
    });

    /* --- reinicio del ciclo de inactividad del MOPI --- */
    var reinicios = ['touchstart', 'mousedown', 'keydown', 'wheel'];
    for (var r = 0; r < reinicios.length; r++) {
      escuchar(document, reinicios[r], toqueMopi);
    }
  }

  /* =======================================================================
     ARRANQUE
     ======================================================================= */
  function iniciar() {
    if (est.iniciado) return;
    est.iniciado = true;

    if (typeof qrcode !== 'undefined' && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) {
      qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
    }
    if (typeof XLSX === 'undefined') {
      console.warn('[calendario] SheetJS no esta disponible; no se podra leer el Excel.');
    }

    est.mesVista = primerDiaMes(new Date());
    est.mesReal = claveMes(new Date());
    est.diaReal = hoyIso();
    est.modo = detectarModo();
    document.documentElement.setAttribute('data-modo', est.modo);

    conectarEventos();
    pintar();
    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
      document.fonts.ready.then(function () {
        if (est.modo !== 'movil') { ajustarRejilla(); }
      });
    }
    cargarDatos(true);

    setInterval(function () { cargarDatos(false); }, MS_RECARGA);

    setInterval(function () {
      var ahora = claveMes(new Date());
      if (ahora !== est.mesReal) {
        est.mesReal = ahora;
        irAHoy();
      } else if (hoyIso() !== est.diaReal) {
        /* refresca el marcador de "hoy" al cruzar la medianoche */
        est.diaReal = hoyIso();
        pintar();
      }

    if (est.modo === 'mopi') { reiniciarInactividad(); }
  }

  return {
    iniciar: iniciar,
    estado: est,
    recargar: function () { cargarDatos(false); },
    modo: function (m) { aplicarModo(m, true); }
  };
}());
